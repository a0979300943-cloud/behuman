<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="alley5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071019"/><stop offset=".55" stop-color="#0a1320"/><stop offset="1" stop-color="#16263d"/>
    </linearGradient>
    <linearGradient id="ground5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1826"/><stop offset="1" stop-color="#040810"/>
    </linearGradient>
    <radialGradient id="mouth5" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#d6ecff"/><stop offset=".4" stop-color="#8fc1e8" stop-opacity=".55"/><stop offset="1" stop-color="#8fc1e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam5a" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe4ff" stop-opacity=".5"/><stop offset="1" stop-color="#bfe4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam5b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d2" stop-opacity=".4"/><stop offset="1" stop-color="#fff3d2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="alienGlow5" cx="50%" cy="46%" r="54%">
      <stop offset="0" stop-color="#c8f4ff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#7fd6f5" stop-opacity=".4"/>
      <stop offset="1" stop-color="#8fe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alienSkin5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4f6ff"/><stop offset=".55" stop-color="#8fd8f2"/><stop offset="1" stop-color="#57a4cc"/>
    </linearGradient>
    <pattern id="rain5" width="120" height="140" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="20" y1="0" x2="8" y2="46" stroke="#9fc7e8" stroke-width="1.4" opacity=".5"/>
      <line x1="78" y1="20" x2="66" y2="66" stroke="#bfe0f6" stroke-width="1.2" opacity=".4"/>
      <line x1="106" y1="70" x2="94" y2="116" stroke="#9fc7e8" stroke-width="1.3" opacity=".45"/>
      <line x1="42" y1="92" x2="30" y2="138" stroke="#cfeaff" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#alley5)"/>

  <!-- 巷子出口强光（右侧） -->
  <polygon points="1260,180 1600,120 1600,760 1260,690" fill="#101c30"/>
  <polygon points="1330,250 1600,210 1600,680 1330,640" fill="url(#mouth5)"/>

  <!-- 两侧墙体 -->
  <polygon points="0,0 1330,250 1330,330 0,300" fill="#0a1420"/>
  <polygon points="0,900 1330,640 1330,720 0,900" fill="#070e18"/>
  <!-- 砖墙线 -->
  <g stroke="#15283f" stroke-width="2" opacity=".6">
    <line x1="0" y1="120" x2="1330" y2="300"/><line x1="0" y1="230" x2="1330" y2="330"/>
    <line x1="0" y1="820" x2="1330" y2="660"/><line x1="0" y1="740" x2="1330" y2="690"/>
    <line x1="180" y1="0" x2="260" y2="286"/><line x1="460" y1="0" x2="520" y2="286"/>
    <line x1="760" y1="0" x2="800" y2="286"/><line x1="1060" y1="0" x2="1080" y2="286"/>
  </g>

  <!-- 地面 -->
  <polygon points="0,900 1600,900 1330,720 1330,640 0,860" fill="url(#ground5)"/>
  <ellipse cx="560" cy="800" rx="220" ry="40" fill="#8fe6ff" opacity=".12"/>

  <!-- 手电光束 -->
  <polygon points="1560,300 1560,420 700,520 700,420" fill="url(#beam5a)"/>
  <polygon points="1560,470 1560,560 820,700 760,620" fill="url(#beam5b)"/>
  <!-- 光束里的人影剪影 -->
  <g fill="#070d18">
    <circle cx="1462" cy="430" r="16"/><path d="M1440,540 q0,-60 22,-60 q22,0 22,60 Z"/>
    <circle cx="1522" cy="404" r="14"/><path d="M1504,500 q0,-52 18,-52 q18,0 18,52 Z"/>
    <rect x="1470" y="452" width="10" height="56" rx="4" transform="rotate(-28 1475 480)" fill="#1d2c42"/>
    <rect x="1480" y="430" width="34" height="12" rx="6" transform="rotate(-28 1490 436)" fill="#2a3f5c"/>
  </g>

  <!-- 垃圾桶与掩体 -->
  <g>
    <rect x="120" y="660" width="150" height="180" rx="12" fill="#0e1c2c"/>
    <rect x="120" y="660" width="150" height="26" rx="10" fill="#16283c"/>
    <line x1="140" y1="720" x2="250" y2="720" stroke="#1d3450" stroke-width="3"/>
    <rect x="300" y="700" width="110" height="140" rx="10" fill="#0b1726"/>
    <rect x="300" y="700" width="110" height="20" rx="8" fill="#14243a"/>
  </g>

  <!-- 蜷缩的外星人 -->
  <g transform="translate(800,648)">
    <ellipse cx="0" cy="126" rx="300" ry="58" fill="#8fe6ff" opacity=".1"/>
    <circle cx="0" cy="16" r="176" fill="url(#alienGlow5)"/>
    <!-- 身体（抱膝） -->
    <path d="M-96,130 C-118,30 -60,-40 0,-42 C62,-40 116,28 96,130 Q0,158 -96,130 Z" fill="url(#alienSkin5)"/>
    <path d="M-96,130 C-110,60 -70,0 -30,-24 C-60,40 -52,100 -40,132 Q-70,136 -96,130 Z" fill="#5ba9cc" opacity=".55"/>
    <!-- 手臂抱膝 -->
    <path d="M-78,30 q-26,52 -8,104" fill="none" stroke="#4b93bd" stroke-width="20" stroke-linecap="round"/>
    <path d="M78,30 q26,52 8,104" fill="none" stroke="#4b93bd" stroke-width="20" stroke-linecap="round" opacity=".8"/>
    <!-- 头 -->
    <ellipse cx="0" cy="-52" rx="58" ry="64" fill="url(#alienSkin5)"/>
    <!-- 紧张的大眼睛 -->
    <ellipse cx="-22" cy="-50" rx="13" ry="17" fill="#08131f"/>
    <ellipse cx="22" cy="-50" rx="13" ry="17" fill="#08131f"/>
    <circle cx="-18" cy="-56" r="4.5" fill="#dff6ff"/>
    <circle cx="26" cy="-56" r="4.5" fill="#dff6ff"/>
    <!-- 抿紧的嘴 -->
    <path d="M-12,-20 q12,-4 24,0" stroke="#2f6f8e" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <!-- 生物荧光斑纹 -->
    <g fill="#d9fbff" opacity=".8">
      <circle cx="-52" cy="10" r="3.4"/><circle cx="-40" cy="52" r="2.6"/><circle cx="-56" cy="86" r="2.2"/>
      <circle cx="46" cy="26" r="2.8"/><circle cx="58" cy="70" r="2.2"/><circle cx="30" cy="104" r="2.6"/>
      <circle cx="-16" cy="-90" r="2"/><circle cx="14" cy="-92" r="2"/>
    </g>
  </g>

  <!-- 雨 -->
  <rect width="1600" height="900" fill="url(#rain5)" opacity=".7"/>

  <!-- 雾气 -->
  <ellipse cx="900" cy="780" rx="500" ry="70" fill="#9fc7e8" opacity=".07"/>
  <ellipse cx="300" cy="840" rx="360" ry="50" fill="#bfe0f6" opacity=".06"/>
</svg>
