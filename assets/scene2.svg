<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0e1a3a"/><stop offset="1" stop-color="#04060f"/>
    </radialGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123050"/><stop offset=".55" stop-color="#0c2140"/><stop offset="1" stop-color="#08162e"/>
    </linearGradient>
    <radialGradient id="holoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe8b8" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#ffb066" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="holoSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12244a"/><stop offset=".62" stop-color="#3a2c44"/><stop offset="1" stop-color="#ff9e5e"/>
    </linearGradient>
    <linearGradient id="earthBall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd0ff"/><stop offset=".6" stop-color="#2e7fd0"/><stop offset="1" stop-color="#14406f"/>
    </linearGradient>
    <radialGradient id="rimWarm" cx="82%" cy="46%" r="55%">
      <stop offset="0" stop-color="#ffb072" stop-opacity=".55"/><stop offset="1" stop-color="#ffb072" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2" width="260" height="260" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="50" r="1.3" fill="#9fc7ee"/>
      <circle cx="140" cy="40" r=".9" fill="#fff"/>
      <circle cx="210" cy="110" r="1.5" fill="#8fbde8"/>
      <circle cx="70" cy="170" r="1" fill="#cfe4ff"/>
      <circle cx="180" cy="210" r="1.1" fill="#9fc7ee"/>
    </pattern>
    <clipPath id="holoClip"><circle cx="1080" cy="330" r="172"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect width="1600" height="900" fill="url(#p2)" opacity=".5"/>

  <!-- 外星人大脸 -->
  <g>
    <ellipse cx="640" cy="540" rx="286" ry="330" fill="url(#skin2)"/>
    <ellipse cx="640" cy="540" rx="286" ry="330" fill="url(#rimWarm)"/>
    <ellipse cx="640" cy="540" rx="286" ry="330" fill="none" stroke="#57b6dd" stroke-width="2" opacity=".35"/>
    <!-- 眼睛 -->
    <path d="M470,470 C500,420 580,420 612,468 C580,512 500,514 470,470 Z" fill="#020610"/>
    <path d="M672,468 C704,420 786,420 814,470 C786,514 704,512 672,468 Z" fill="#020610"/>
    <circle cx="560" cy="466" r="10" fill="#cdeeff"/>
    <circle cx="752" cy="466" r="10" fill="#cdeeff"/>
    <circle cx="536" cy="452" r="3.4" fill="#fff"/>
    <circle cx="728" cy="452" r="3.4" fill="#fff"/>
    <!-- 眼睛里映出的暖光 -->
    <path d="M500,452 C540,436 590,440 606,464" fill="none" stroke="#ffb072" stroke-width="4" opacity=".55"/>
    <path d="M702,464 C720,440 770,436 806,452" fill="none" stroke="#ffb072" stroke-width="4" opacity=".55"/>
    <!-- 鼻、嘴 -->
    <path d="M640,520 v34" stroke="#0a1a30" stroke-width="4" stroke-linecap="round"/>
    <path d="M600,610 Q640,642 684,610" fill="none" stroke="#7fd0e6" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <!-- 生物荧光小斑 -->
    <circle cx="560" cy="560" r="3" fill="#8fe6ff" opacity=".7"/>
    <circle cx="730" cy="572" r="2.4" fill="#8fe6ff" opacity=".6"/>
    <circle cx="690" cy="536" r="2" fill="#8fe6ff" opacity=".5"/>
  </g>

  <!-- 全息投影：地球城市 -->
  <circle cx="1080" cy="330" r="230" fill="url(#holoGlow)"/>
  <g clip-path="url(#holoClip)">
    <rect x="880" y="120" width="400" height="420" fill="url(#holoSky)"/>
    <!-- 地球 -->
    <circle cx="1080" cy="232" r="96" fill="url(#earthBall)"/>
    <path d="M1010,210 q30,-30 70,-12 q24,12 50,-2" fill="none" stroke="#bff0d8" stroke-width="12" opacity=".55" stroke-linecap="round"/>
    <path d="M1030,262 q40,18 80,-4" fill="none" stroke="#bff0d8" stroke-width="9" opacity=".4" stroke-linecap="round"/>
    <!-- 城市天际线 -->
    <g fill="#1a1226">
      <rect x="880" y="400" width="46" height="140"/>
      <rect x="930" y="372" width="58" height="168"/>
      <rect x="994" y="414" width="40" height="126"/>
      <rect x="1040" y="356" width="66" height="184"/>
      <rect x="1112" y="392" width="48" height="148"/>
      <rect x="1164" y="368" width="60" height="172"/>
      <rect x="1228" y="410" width="52" height="130"/>
    </g>
    <!-- 窗灯 -->
    <g fill="#ffd98a">
      <rect x="942" y="388" width="6" height="6"/><rect x="962" y="388" width="6" height="6"/><rect x="942" y="408" width="6" height="6"/>
      <rect x="1056" y="376" width="7" height="7"/><rect x="1080" y="376" width="7" height="7"/><rect x="1056" y="400" width="7" height="7"/>
      <rect x="1178" y="388" width="6" height="6"/><rect x="1198" y="408" width="6" height="6"/><rect x="1178" y="428" width="6" height="6"/>
    </g>
    <!-- 欢笑的小人剪影 -->
    <g fill="#241430">
      <circle cx="980" cy="470" r="12"/><path d="M964,520 q0,-34 16,-34 q16,0 16,34 Z"/>
      <circle cx="1130" cy="466" r="13"/><path d="M1112,522 q0,-38 18,-38 q18,0 18,38 Z"/>
    </g>
  </g>
  <circle cx="1080" cy="330" r="172" fill="none" stroke="#a9ecff" stroke-width="2.4" opacity=".85"/>
  <circle cx="1080" cy="330" r="186" fill="none" stroke="#a9ecff" stroke-width="1" opacity=".35"/>
  <!-- 投影光束到底座 -->
  <polygon points="1010,500 1150,500 1192,690 968,690" fill="#7fd4ff" opacity=".08"/>
  <rect x="990" y="686" width="180" height="12" rx="6" fill="#1a3b5e"/>
  <rect x="1010" y="698" width="140" height="8" rx="4" fill="#0e2238"/>
  <!-- 声波线 -->
  <g fill="none" stroke="#9fe6ff" stroke-width="2.4" stroke-linecap="round" opacity=".8">
    <path d="M868,330 q-20,0 -20,-30"/>
    <path d="M856,262 q-40,12 -30,56" opacity=".6"/>
    <path d="M1292,330 q20,0 20,-30"/>
    <path d="M1304,262 q40,12 30,56" opacity=".6"/>
  </g>
</svg>
