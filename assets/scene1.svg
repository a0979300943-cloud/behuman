<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/><stop offset="1" stop-color="#05081a"/>
    </linearGradient>
    <radialGradient id="space" cx="68%" cy="38%" r="72%">
      <stop offset="0" stop-color="#16335c"/><stop offset=".55" stop-color="#0a1736"/><stop offset="1" stop-color="#04060f"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a1" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd07a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="console" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11274a"/><stop offset="1" stop-color="#060d20"/>
    </linearGradient>
    <pattern id="p1" width="240" height="240" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="48" r="1.5" fill="#cdeaff"/>
      <circle cx="120" cy="30" r="1" fill="#fff"/>
      <circle cx="190" cy="90" r="1.8" fill="#bfe6ff"/>
      <circle cx="60" cy="140" r="1" fill="#eaf6ff"/>
      <circle cx="160" cy="180" r="1.3" fill="#cdeaff"/>
      <circle cx="210" cy="210" r=".9" fill="#fff"/>
      <circle cx="30" cy="210" r="1.2" fill="#bfe6ff"/>
      <circle cx="96" cy="100" r=".8" fill="#fff"/>
    </pattern>
    <clipPath id="windowClip"><ellipse cx="830" cy="408" rx="606" ry="330"/></clipPath>
    <radialGradient id="beamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6ab" stop-opacity=".8"/><stop offset="1" stop-color="#ffe6ab" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- 舷窗内的宇宙 -->
  <ellipse cx="830" cy="408" rx="606" ry="330" fill="url(#space)"/>
  <g clip-path="url(#windowClip)">
    <rect x="200" y="60" width="1260" height="700" fill="url(#p1)"/>
    <circle cx="1170" cy="250" r="4" fill="#fff"/>
    <circle cx="1170" cy="250" r="14" fill="#fff" opacity=".15"/>
    <circle cx="1230" cy="232" r="2.2" fill="#9fe0ff"/>
    <!-- 远处的地球小点 -->
    <circle cx="1150" cy="262" r="7" fill="#5fb7ff"/>
    <circle cx="1150" cy="262" r="16" fill="#5fb7ff" opacity=".25"/>
    <!-- 金色信号光束 -->
    <circle cx="1150" cy="262" r="72" fill="url(#beamGlow)"/>
    <polygon points="1146,250 1162,250 886,756 820,756" fill="url(#beam)" opacity=".55"/>
    <polygon points="1150,256 1158,256 880,762 860,762" fill="#fff" opacity=".12"/>
  </g>
  <ellipse cx="830" cy="408" rx="606" ry="330" fill="none" stroke="#203866" stroke-width="26"/>
  <ellipse cx="830" cy="408" rx="622" ry="344" fill="none" stroke="#0a1430" stroke-width="10"/>

  <!-- 舷窗框架结构 -->
  <path d="M220 408 A610 332 0 0 1 1440 408" fill="none" stroke="#101f44" stroke-width="34" opacity=".9"/>
  <circle cx="830" cy="78" r="10" fill="#2c4a82"/>
  <circle cx="252" cy="556" r="9" fill="#2c4a82"/>
  <circle cx="1408" cy="556" r="9" fill="#2c4a82"/>

  <!-- 外星航空员背影 -->
  <g transform="translate(486,548)">
    <path d="M-78,270 C-86,140 -52,86 0,82 C52,86 86,140 78,270 Z" fill="#071026"/>
    <path d="M-78,270 C-70,160 -40,116 0,110 C40,116 70,160 78,270 Z" fill="#0a1838"/>
    <ellipse cx="0" cy="62" rx="64" ry="70" fill="#0b1b3d"/>
    <ellipse cx="0" cy="62" rx="64" ry="70" fill="none" stroke="#57c8e8" stroke-width="2.2" opacity=".55"/>
    <path d="M-58,20 C-30,-8 30,-8 58,20" fill="none" stroke="#6dd6f2" stroke-width="2" opacity=".35"/>
    <!-- 座椅 -->
    <rect x="-96" y="120" width="192" height="170" rx="40" fill="#081226"/>
  </g>

  <!-- 控制台 -->
  <path d="M0,900 L0,742 L700,718 L980,742 L1600,716 L1600,900 Z" fill="url(#console)"/>
  <path d="M0,742 L700,718 L980,742" fill="none" stroke="#3d6ea6" stroke-width="2" opacity=".5"/>
  <!-- 屏幕 -->
  <g opacity=".95">
    <rect x="620" y="748" width="180" height="86" rx="10" fill="#07162c" stroke="#2c6c9e" stroke-width="1.5"/>
    <polyline points="640,812 672,792 704,802 736,772 770,786" fill="none" stroke="#6ee7ff" stroke-width="3"/>
    <rect x="852" y="752" width="240" height="12" rx="6" fill="#163e64"/>
    <rect x="852" y="780" width="180" height="10" rx="5" fill="#123353"/>
    <rect x="852" y="802" width="210" height="10" rx="5" fill="#123353"/>
    <circle cx="1150" cy="800" r="26" fill="none" stroke="#3d8ec0" stroke-width="2"/>
    <circle cx="1150" cy="800" r="14" fill="#0e3355"/>
    <circle cx="1150" cy="800" r="5" fill="#6ee7ff"/>
  </g>
  <!-- 信号落在控制台的金光 -->
  <ellipse cx="860" cy="748" rx="90" ry="18" fill="#ffd98a" opacity=".35"/>
</svg>
