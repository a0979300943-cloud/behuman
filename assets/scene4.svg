<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a3e"/><stop offset=".55" stop-color="#3a2a52"/><stop offset="1" stop-color="#6b3a4e"/>
    </linearGradient>
    <linearGradient id="street4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242140"/><stop offset="1" stop-color="#0b0a18"/>
    </linearGradient>
    <radialGradient id="lamp4" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffd07a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neon4" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity=".8"/><stop offset="1" stop-color="#6ee7ff" stop-opacity="0"/>
    </radialGradient>
    <symbol id="human" viewBox="-30 -60 60 120">
      <circle cx="0" cy="-42" r="12" fill="currentColor"/>
      <path d="M-17,26 C-19,-2 -14,-28 0,-30 C14,-28 19,-2 17,26 Z" fill="currentColor"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky4)"/>

  <!-- 远处楼宇 -->
  <g opacity=".9">
    <rect x="80" y="300" width="130" height="330" fill="#1d1c3c"/>
    <rect x="224" y="240" width="104" height="390" fill="#232046"/>
    <rect x="342" y="340" width="150" height="290" fill="#1b1a38"/>
    <rect x="1108" y="250" width="120" height="380" fill="#232046"/>
    <rect x="1240" y="320" width="150" height="310" fill="#1d1c3c"/>
    <rect x="1404" y="280" width="116" height="350" fill="#26224b"/>
  </g>
  <!-- 窗灯 -->
  <g fill="#ffd98a" opacity=".85">
    <rect x="104" y="330" width="9" height="9"/><rect x="134" y="330" width="9" height="9"/><rect x="164" y="330" width="9" height="9"/>
    <rect x="104" y="362" width="9" height="9"/><rect x="164" y="362" width="9" height="9"/>
    <rect x="244" y="272" width="8" height="8"/><rect x="270" y="272" width="8" height="8"/><rect x="296" y="272" width="8" height="8"/>
    <rect x="244" y="300" width="8" height="8"/><rect x="270" y="300" width="8" height="8"/>
    <rect x="370" y="372" width="9" height="9"/><rect x="406" y="372" width="9" height="9"/><rect x="442" y="372" width="9" height="9"/>
    <rect x="370" y="404" width="9" height="9"/><rect x="442" y="404" width="9" height="9"/>
    <rect x="1130" y="282" width="9" height="9"/><rect x="1162" y="282" width="9" height="9"/><rect x="1194" y="282" width="9" height="9"/>
    <rect x="1130" y="314" width="9" height="9"/><rect x="1194" y="314" width="9" height="9"/>
    <rect x="1264" y="352" width="9" height="9"/><rect x="1300" y="352" width="9" height="9"/><rect x="1336" y="352" width="9" height="9"/>
    <rect x="1264" y="386" width="9" height="9"/><rect x="1336" y="386" width="9" height="9"/>
    <rect x="1428" y="312" width="9" height="9"/><rect x="1460" y="312" width="9" height="9"/><rect x="1492" y="312" width="9" height="9"/>
  </g>
  <g fill="#8fd8ff" opacity=".8">
    <rect x="104" y="394" width="9" height="9"/><rect x="244" y="330" width="8" height="8"/><rect x="370" y="438" width="9" height="9"/>
    <rect x="1130" y="346" width="9" height="9"/><rect x="1264" y="420" width="9" height="9"/><rect x="1460" y="346" width="9" height="9"/>
  </g>

  <!-- 霓虹招牌 -->
  <rect x="1330" y="238" width="118" height="34" rx="6" fill="none" stroke="#6ee7ff" stroke-width="3"/>
  <rect x="1330" y="238" width="118" height="34" rx="6" fill="url(#neon4)" opacity=".4"/>
  <rect x="150" y="266" width="90" height="28" rx="14" fill="none" stroke="#ff8fa8" stroke-width="3" opacity=".85"/>

  <!-- 街道（透视） -->
  <polygon points="0,900 1600,900 900,560 700,560" fill="url(#street4)"/>
  <polygon points="700,560 900,560 1010,900 590,900" fill="#2e2a4f"/>
  <!-- 地面反光 -->
  <g opacity=".5">
    <ellipse cx="430" cy="760" rx="120" ry="16" fill="#ffd07a" opacity=".35"/>
    <ellipse cx="1200" cy="740" rx="150" ry="18" fill="#6ee7ff" opacity=".28"/>
    <ellipse cx="800" cy="820" rx="190" ry="14" fill="#ff8fa8" opacity=".22"/>
  </g>

  <!-- 路灯 -->
  <g>
    <rect x="392" y="470" width="8" height="250" fill="#12122a"/>
    <path d="M396,470 q0,-26 60,-26" fill="none" stroke="#12122a" stroke-width="8"/>
    <circle cx="470" cy="446" r="20" fill="#ffe2a8"/>
    <circle cx="470" cy="446" r="90" fill="url(#lamp4)"/>
    <rect x="1180" y="452" width="8" height="270" fill="#12122a"/>
    <path d="M1184,452 q0,-26 -60,-26" fill="none" stroke="#12122a" stroke-width="8"/>
    <circle cx="1122" cy="428" r="18" fill="#ffe2a8"/>
    <circle cx="1122" cy="428" r="82" fill="url(#lamp4)"/>
  </g>

  <!-- 人群 -->
  <g opacity=".95">
    <use href="#human" x="250" y="800" transform="scale(1.35)" style="color:#141228"/>
    <use href="#human" x="1330" y="812" transform="scale(1.45)" style="color:#17142f"/>
    <use href="#human" x="560" y="772" transform="scale(1.12)" style="color:#1b1836"/>
    <use href="#human" x="1060" y="776" transform="scale(1.18)" style="color:#191533"/>
    <use href="#human" x="680" y="730" transform="scale(.92)" style="color:#201c3e"/>
  </g>

  <!-- 主角：伪装成人类的外星人 -->
  <g transform="translate(800,720)">
    <ellipse cx="0" cy="60" rx="60" ry="16" fill="#000" opacity=".45"/>
    <!-- 外套 -->
    <path d="M-34,96 C-40,20 -26,-34 0,-38 C26,-34 40,20 34,96 Z" fill="#3a4a6e"/>
    <path d="M-34,96 C-40,20 -26,-34 0,-38 L0,96 Z" fill="#2e3c5c"/>
    <!-- 围巾 -->
    <path d="M-22,-30 q22,16 44,0 l4,16 q-26,14 -52,0 Z" fill="#ffd98a"/>
    <!-- 头（拟态人类，微微泛青） -->
    <circle cx="0" cy="-58" r="26" fill="#f0c9a8"/>
    <path d="M-26,-60 q4,-30 26,-30 q22,0 26,30 q-12,-14 -26,-14 q-14,0 -26,14 Z" fill="#2a2436"/>
    <circle cx="-9" cy="-58" r="3" fill="#2b2a3a"/>
    <circle cx="9" cy="-58" r="3" fill="#2b2a3a"/>
    <path d="M-7,-46 q7,6 14,0" stroke="#b06a52" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- 一丝藏不住的青色微光 -->
    <circle cx="0" cy="-58" r="34" fill="url(#neon4)" opacity=".35"/>
    <path d="M-26,-60 q4,-30 26,-30 q22,0 26,30" fill="none" stroke="#6ee7ff" stroke-width="1.6" opacity=".4"/>
  </g>
</svg>
